# Builds an installable APK in the cloud, so getting the app onto the tablet
# needs nothing installed on your own machine -- no Android Studio, no SDK, no
# JDK. See docs/INSTALL.md for what to do with the result.
name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets you build on demand from the Actions tab. Only a manual run publishes
  # the "latest-debug" release, so the download link the tablet uses changes
  # when you say so rather than on every push.
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # AGP 8.13 needs JDK 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android command-line tools and accepts the SDK licences,
      # which is what lets Gradle fetch the compileSdk 36 platform by itself.
      - uses: android-actions/setup-android@v3

      # Caches the Gradle distribution and dependency downloads between runs.
      - uses: gradle/actions/setup-gradle@v4

      # Cheap structural checks first. Both catch mistakes whose real error
      # message points somewhere unrelated, so finding them here saves reading
      # a confusing stack trace later.
      - name: Structural checks
        run: |
          bash tools/check-declaration-clashes.sh
          bash tools/check-serial-names.sh

      # Unit tests next: a failure here is a real bug, and it is much easier
      # to read than the same problem surfacing as a crash on the tablet.
      #
      # testDebugUnitTest, not test. The plain `test` task runs the release
      # variant's tests too, which drags the whole release pipeline in --
      # KSP, R8 minification, resource shrinking -- for a workflow that only
      # ever ships a debug APK. It is not just slow: it was also where a KSP
      # worker failed on a restored build cache, breaking a build for reasons
      # that had nothing to do with the code under test.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Android refuses to update an app whose signing key changed, so a build
      # signed with the wrong key is not a cosmetic problem: it forces an
      # uninstall, and the map library goes with it. This used to happen on
      # every build, because AGP quietly creates ~/.android/debug.keystore when
      # it cannot find one and a fresh runner has no such file.
      #
      # The expected fingerprint is read from the committed keystore rather
      # than hardcoded, so replacing the key needs no edit here -- what is
      # being checked is that the APK was signed with *that* file.
      - name: Verify the APK is signed with the committed debug key
        run: |
          set -euo pipefail
          expected=$(keytool -list -v -keystore app/debug.keystore -storepass android \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ': \r' | tr 'A-Z' 'a-z')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk \
            | grep -m1 -i 'SHA-256 digest' | sed 's/.*: *//' | tr -d ' \r' | tr 'A-Z' 'a-z')
          echo "expected $expected"
          echo "actual   $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::APK signed with an unexpected key; installs would need an uninstall first."
            exit 1
          fi
          echo "Signing key matches app/debug.keystore."

      # Always available, on every push and pull request, under the run's
      # Artifacts section. GitHub wraps artifacts in a zip.
      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-maps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A release asset is a plain file rather than a zip, so the tablet can
      # download and open it in one tap -- no unzipping app required. The tag
      # is reused, so the download URL never changes.
      - name: Publish to the latest-debug release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Latest debug build" \
              --notes "Debug build of the RPG Maps tablet app. Rebuilt by running the Build APK workflow from the Actions tab."
          gh release upload latest-debug app/build/outputs/apk/debug/*.apk --clobber
